<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Alumot / Nets</title>
    <meta name="theme-color" content="#241b3a">
    <style>
      :root {
        --bg: #241b3a;
        --fg: #ffffff;
        --muted: rgba(255, 255, 255, 0.65);
        --brand: #7e57a8;
        --brand-dark: #5e3d83;
        --button-bg: #7e57a8;
        --button-fg: #ffffff;
        --button-border: transparent;
        --button-bg-hover: #9670bf;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans Hebrew", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      }

      .card {
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
      }

      .logo {
        width: 160px;
        height: auto;
        display: block;
        filter: invert(1);
      }

      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.2px;
        text-align: center;
        color: var(--fg);
      }

      .links {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 4px;
      }

      .link {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 14px 20px;
        border-radius: 14px;
        background: var(--button-bg);
        color: var(--button-fg);
        border: 1px solid var(--button-border);
        text-decoration: none;
        font-size: 17px;
        font-weight: 600;
        transition: background-color 0.15s ease, transform 0.05s ease;
      }

      .link:hover { background: var(--button-bg-hover); }
      .link:active { transform: scale(0.98); }
      .link:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="assets/logo.svg" alt="אלומות" onerror="this.style.display='none'">

      <h1>Alumot / Nets</h1>

      <nav class="links" aria-label="קישורים">
        <a class="link" href="https://example.com/" target="_blank" rel="noopener">
          אתר
        </a>
        <a class="link" href="https://apps.apple.com/il/app/nets/id6470527072" target="_blank" rel="noopener">
          App Store
        </a>
        <a class="link" href="https://play.google.com/store/apps/details?id=gov.idf.nodoots&amp;pcampaignid=web_share" target="_blank" rel="noopener">
          Google Play
        </a>
      </nav>
    </main>
  </body>
</html>
