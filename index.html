<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Alumot / Nets</title>
    <meta name="theme-color" content="#000000">
    <style>
      :root {
        --bg: #000000;
        --fg: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.22);
        --accent: #6b3f96;
        --hairline: rgba(255, 255, 255, 0.07);
        --hairline-strong: rgba(255, 255, 255, 0.14);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans Hebrew", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      }

      .card {
        width: 100%;
        max-width: 380px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
      }

      .logo {
        width: 140px;
        height: auto;
        display: block;
      }

      .links {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .link {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 14px 20px;
        border-radius: 12px;
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--hairline);
        text-decoration: none;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.2px;
        transition: border-color 0.15s ease, background-color 0.15s ease, transform 0.05s ease;
      }

      .link:hover { border-color: var(--hairline-strong); }
      .link:active { transform: scale(0.99); }
      .link:focus-visible {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 1px rgba(107, 63, 150, 0.5);
      }

      .version {
        position: fixed;
        bottom: 12px;
        left: 12px;
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 1px;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="assets/logo.svg" alt="אלומות" onerror="this.style.display='none'">

      <nav class="links" aria-label="קישורים">
        <a class="link" href="https://example.com/" target="_blank" rel="noopener">
          אתר
        </a>
        <a class="link" href="https://apps.apple.com/il/app/nets/id6470527072" target="_blank" rel="noopener">
          App Store
        </a>
        <a class="link" href="https://play.google.com/store/apps/details?id=gov.idf.nodoots&amp;pcampaignid=web_share" target="_blank" rel="noopener">
          Google Play
        </a>
      </nav>
    </main>
    <div class="version" aria-hidden="true">v6</div>
  </body>
</html>
